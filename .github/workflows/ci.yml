name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: VRCGPUTool.slnx
      Test_Project_Path: VRCGPUTool.Tests\VRCGPUTool.Tests.csproj

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build $env:Solution_Name --configuration $env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}

      - name: Test
        run: dotnet test $env:Test_Project_Path --configuration $env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}
